global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    lab: rca-incident-lab

rule_files:
  - rules/*.yml
  # Prometheus solo admite comodines en el nombre del archivo, no en carpetas
  - scenarios/connection-pool-exhaustion/alerts.yml
  - scenarios/cpu-spike/alerts.yml
  - scenarios/db-lock/alerts.yml
  - scenarios/disk-full/alerts.yml
  - scenarios/dns-broken/alerts.yml
  - scenarios/expired-cert/alerts.yml
  - scenarios/memory-leak/alerts.yml
  - scenarios/slow-query/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: orders-api
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["api:8000"]

  - job_name: orders-worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:9102"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_verified]
    static_configs:
      - targets: ["https://nginx/healthz"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tls
    metrics_path: /probe
    params:
      module: [https_insecure]
    static_configs:
      - targets: ["https://nginx/healthz"]
    relabel_configs: *blackbox_relabel

  - job_name: blackbox-readyz
    metrics_path: /probe
    params:
      module: [https_insecure]
    static_configs:
      - targets: ["https://nginx/readyz"]
    relabel_configs: *blackbox_relabel
