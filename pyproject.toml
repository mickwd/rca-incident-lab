[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-incident-lab"
version = "1.0.0"
description = "Laboratorio de análisis de causa raíz: fallas reproducibles, runbooks y postmortems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
labctl = "labctl.cli:run"

[tool.setuptools]
packages = ["labctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/orders", "services/loadgen", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = [
    "RUF001",  # textos en español con caracteres que ruff considera ambiguos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S311"]
"services/loadgen/**" = ["S311"]
"labctl/cli.py" = ["S311"]
"labctl/scenarios.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["orders", "labctl", "loadgen"]
