worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # rt = tiempo total en nginx, urt = tiempo del upstream, ust = status del upstream
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time ust=$upstream_status '
                    'rid=$request_id';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # DNS interno de Docker. Resolver en cada request (con cache corto) evita que
    # nginx quede apuntando a la IP vieja cuando se recrea el contenedor de la API
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name localhost nginx;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Las métricas se scrapean directo contra la API por la red interna
        location = /metrics {
            return 403;
        }

        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header X-Request-ID $request_id always;
        }
    }
}
