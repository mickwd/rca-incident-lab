name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROM_IMAGE: prom/prometheus:v2.53.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validar docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose --profile load config --quiet
          docker compose -f docker-compose.yml -f scenarios/dns-broken/compose.fault.yml config --quiet
      - name: Build de imágenes
        run: docker compose --profile load build

  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/scenarios:/etc/prometheus/scenarios:ro" \
            "$PROM_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/scenarios:/etc/prometheus/scenarios:ro" \
            "$PROM_IMAGE" -c 'promtool check rules /etc/prometheus/rules/*.yml /etc/prometheus/scenarios/*/alerts.yml'

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, compose, promtool]
    env:
      BASE: https://localhost:8443
      CA: certs/ca.crt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar labctl
        run: pip install -e .

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar readyz a través de nginx
        timeout-minutes: 6
        run: |
          for i in $(seq 1 70); do
            if curl -fsS --max-time 5 --cacert "$CA" "$BASE/readyz"; then
              echo; echo "listo después de $i intentos"; exit 0
            fi
            sleep 5
          done
          echo "el stack no quedó listo" >&2
          exit 1

      - name: Tráfico básico
        run: |
          curl -fsS --cacert "$CA" "$BASE/products/1"
          curl -fsS --cacert "$CA" -X POST "$BASE/orders" \
            -H 'Content-Type: application/json' \
            -d '{"customer_id": 10, "product_id": 1, "quantity": 1, "reference": "PO-1-A"}'
          labctl status

      - name: Escenario slow-query
        timeout-minutes: 8
        run: |
          plan() {
            docker compose exec -T postgres psql -U orders -d orders -At -c \
              "EXPLAIN SELECT * FROM orders WHERE customer_id = 4242 ORDER BY created_at DESC LIMIT 20"
          }
          avg_latency() {
            for i in $(seq 1 10); do
              curl -fsS -o /dev/null -w '%{time_total}\n' --cacert "$CA" "$BASE/customers/$((1000 + i))/orders"
            done | awk '{ s += $1 } END { printf "%.4f", s / NR }'
          }
          before=$(avg_latency)
          labctl break slow-query
          plan | tee plan.txt
          grep -q "Seq Scan" plan.txt
          after=$(avg_latency)
          echo "latencia promedio antes=${before}s después=${after}s"
          awk -v a="$after" -v b="$before" 'BEGIN { exit !(a > b * 2) }'
          labctl fix slow-query
          plan | tee plan.txt
          grep -Eq "Index Scan|Bitmap Index Scan" plan.txt

      - name: Escenario dns-broken
        timeout-minutes: 5
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 --cacert "$CA" "$BASE/readyz"; }
          labctl break dns-broken
          for i in $(seq 1 30); do [ "$(code)" = "503" ] && break; sleep 3; done
          test "$(code)" = "503"
          docker compose logs --tail=50 api | grep -Ei "resolve|translate host|name or service"
          labctl fix dns-broken
          for i in $(seq 1 30); do [ "$(code)" = "200" ] && break; sleep 3; done
          test "$(code)" = "200"

      - name: Escenario expired-cert
        timeout-minutes: 5
        run: |
          labctl break expired-cert
          rc=0
          for i in $(seq 1 10); do
            rc=0
            curl -sS --max-time 5 --cacert "$CA" "$BASE/healthz" 2> curl.err || rc=$?
            [ "$rc" -eq 60 ] && break
            sleep 2
          done
          cat curl.err
          test "$rc" -eq 60
          grep -qi "expired" curl.err
          labctl fix expired-cert
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --cacert "$CA" "$BASE/healthz"

      - name: Estado final
        run: labctl status

      - name: Logs ante falla
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Bajar el stack
        if: always()
        run: docker compose --profile load down -v
